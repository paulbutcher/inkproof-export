inductive Inkproof.Export.Prim : Type
constructor Inkproof.Export.Prim.clipBegin : Inkproof.Scene.Rect → Inkproof.Export.Prim
constructor Inkproof.Export.Prim.clipEnd : Inkproof.Export.Prim
constructor Inkproof.Export.Prim.disc : Inkproof.Scene.Color → Inkproof.Scene.Pt → Rat → Inkproof.Export.Prim
constructor Inkproof.Export.Prim.fill : Inkproof.Scene.Color → List Inkproof.Scene.Pt → Inkproof.Export.Prim
constructor Inkproof.Export.Prim.stroke : Inkproof.Scene.Color → Rat → List Inkproof.Scene.Pt → Inkproof.Export.Prim
constructor Inkproof.Export.Prim.text : Inkproof.Scene.Color → Inkproof.Scene.Rect → String → Inkproof.Export.Prim
def Inkproof.Export.adler32 : ByteArray → UInt32
def Inkproof.Export.crc32 : ByteArray → UInt32
def Inkproof.Export.decimal : Rat → String
theorem Inkproof.Export.decimal_spec : ∀ (q : Rat), ∃ neg whole frac, ((Inkproof.Export.decimal q).toList = (if neg = Bool.true then ['-'] else []) ++ whole ++ if frac = [] then [] else '.' :: frac) ∧ whole ≠ [] ∧ frac.length ≤ 3 ∧ frac.getLast? ≠ Option.some '0' ∧ (∀ (c : Char), c ∈ whole ++ frac → c.isDigit = Bool.true) ∧ (neg = Bool.true ↔ Inkproof.Export.thousandths q < 0) ∧ (if neg = Bool.true then -1 else 1) * ↑(Inkproof.Core.Decimal.digitsValue (whole ++ frac)) / 10 ^ frac.length = ↑(Inkproof.Export.thousandths q) / 1000 ∧ q - 1 / 2000 ≤ (if neg = Bool.true then -1 else 1) * ↑(Inkproof.Core.Decimal.digitsValue (whole ++ frac)) / 10 ^ frac.length ∧ (if neg = Bool.true then -1 else 1) * ↑(Inkproof.Core.Decimal.digitsValue (whole ++ frac)) / 10 ^ frac.length ≤ q + 1 / 2000
def Inkproof.Export.encodable : Inkproof.Scene.Image → Prop
def Inkproof.Export.encodePng : Inkproof.Scene.Image → Option ByteArray
theorem Inkproof.Export.encodePng_isSome : ∀ (img : Inkproof.Scene.Image), (Inkproof.Export.encodePng img).isSome = Bool.true ↔ Inkproof.Export.encodable img
def Inkproof.Export.hairline : Rat
instance Inkproof.Export.instDecidableEncodable : (img : Inkproof.Scene.Image) → Decidable (Inkproof.Export.encodable img)
instance Inkproof.Export.instReprPrim : Repr Inkproof.Export.Prim
def Inkproof.Export.instReprPrim.repr : Inkproof.Export.Prim → Nat → Std.Format
def Inkproof.Export.lowerAll : Inkproof.Scene.DisplayList → List Inkproof.Export.Prim
theorem Inkproof.Export.lowerAll_eq : ∀ (dl : Inkproof.Scene.DisplayList), Inkproof.Export.lowerAll dl = List.flatMap (fun c => Inkproof.Export.lowerShape c.color c.shape) dl.paintOrder
def Inkproof.Export.lowerShape : Inkproof.Scene.Color → Inkproof.Scene.Shape → List Inkproof.Export.Prim
theorem Inkproof.Export.lowerShape_area : ∀ (c : Inkproof.Scene.Color) (y0 : Rat) (items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.area y0 items) = Inkproof.Scene.Item.fold (fun a => Inkproof.Export.Prim.stroke c Inkproof.Export.hairline [{ x := a.x, y := y0 }, a]) (fun a b => Inkproof.Export.Prim.fill c [{ x := a.x, y := y0 }, { x := b.x, y := y0 }, b, a]) items
theorem Inkproof.Export.lowerShape_circle : ∀ (c : Inkproof.Scene.Color) (p : Inkproof.Scene.Pt) (r : Rat), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.marker Inkproof.Scene.MarkerShape.circle p r) = [Inkproof.Export.Prim.disc c p r]
theorem Inkproof.Export.lowerShape_clipped : ∀ (c : Inkproof.Scene.Color) (b : Inkproof.Scene.Rect) (inner : Inkproof.Scene.Shape), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.clipped b inner) = Inkproof.Export.Prim.clipBegin b :: Inkproof.Export.lowerShape c inner ++ [Inkproof.Export.Prim.clipEnd]
theorem Inkproof.Export.lowerShape_envelope : ∀ (c : Inkproof.Scene.Color) (items : List (Inkproof.Scene.Item Inkproof.Scene.Column)), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.envelope items) = Inkproof.Scene.Item.fold (fun k => Inkproof.Export.Prim.stroke c Inkproof.Export.hairline [{ x := k.x, y := k.lo }, { x := k.x, y := k.hi }]) (fun a b => Inkproof.Export.Prim.fill c [{ x := a.x, y := a.lo }, { x := b.x, y := b.lo }, { x := b.x, y := b.hi }, { x := a.x, y := a.hi }]) items
theorem Inkproof.Export.lowerShape_rect : ∀ (c : Inkproof.Scene.Color) (b : Inkproof.Scene.Rect), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.rect b) = [Inkproof.Export.Prim.fill c [{ x := b.x0, y := b.y0 }, { x := b.x1, y := b.y0 }, { x := b.x1, y := b.y1 }, { x := b.x0, y := b.y1 }]]
theorem Inkproof.Export.lowerShape_square : ∀ (c : Inkproof.Scene.Color) (p : Inkproof.Scene.Pt) (r : Rat), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.marker Inkproof.Scene.MarkerShape.square p r) = [Inkproof.Export.Prim.fill c [{ x := p.x - r, y := p.y - r }, { x := p.x + r, y := p.y - r }, { x := p.x + r, y := p.y + r }, { x := p.x - r, y := p.y + r }]]
theorem Inkproof.Export.lowerShape_strip : ∀ (c : Inkproof.Scene.Color) (hw : Rat) (items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.strip hw items) = List.map (fun r => match r with | [p] => Inkproof.Export.Prim.disc c p (Max.max (2 * hw) Inkproof.Export.hairline / 2) | r => Inkproof.Export.Prim.stroke c (Max.max (2 * hw) Inkproof.Export.hairline) r) (List.filter (fun x => Decidable.decide (x ≠ [])) (Inkproof.Scene.Item.runs items))
theorem Inkproof.Export.lowerShape_text : ∀ (c : Inkproof.Scene.Color) (b : Inkproof.Scene.Rect) (s : String), Inkproof.Export.lowerShape c (Inkproof.Scene.Shape.text b s) = [Inkproof.Export.Prim.text c b s]
def Inkproof.Export.pdf : Inkproof.Scene.DisplayList → Nat → Nat → ByteArray
def Inkproof.Export.pdfOf : Nat → Nat → List Inkproof.Export.Prim → ByteArray
theorem Inkproof.Export.pdf_eq : ∀ (dl : Inkproof.Scene.DisplayList) (w h : Nat), Inkproof.Export.pdf dl w h = Inkproof.Export.pdfOf w h (List.flatMap (fun c => Inkproof.Export.lowerShape c.color c.shape) dl.paintOrder)
def Inkproof.Export.png : Inkproof.Scene.DisplayList → Inkproof.Scene.Grid → Inkproof.Scene.Color → Option ByteArray
theorem Inkproof.Export.png_eq : ∀ (dl : Inkproof.Scene.DisplayList) (g : Inkproof.Scene.Grid) (bg : Inkproof.Scene.Color), Inkproof.Export.png dl g bg = Inkproof.Export.encodePng (Inkproof.Scene.render dl g bg)
def Inkproof.Export.svg : Inkproof.Scene.DisplayList → Nat → Nat → String
def Inkproof.Export.svgOf : Nat → Nat → List Inkproof.Export.Prim → String
theorem Inkproof.Export.svg_eq : ∀ (dl : Inkproof.Scene.DisplayList) (w h : Nat), Inkproof.Export.svg dl w h = Inkproof.Export.svgOf w h (List.flatMap (fun c => Inkproof.Export.lowerShape c.color c.shape) dl.paintOrder)
def Inkproof.Export.thousandths : Rat → Int
theorem Inkproof.Export.thousandths_close : ∀ (q : Rat), q - 1 / 2000 ≤ ↑(Inkproof.Export.thousandths q) / 1000 ∧ ↑(Inkproof.Export.thousandths q) / 1000 ≤ q + 1 / 2000
def Inkproof.Export.trimZeros : List Char → List Char
theorem Inkproof.Export.trimZeros_spec : ∀ (frac : List Char), ∃ k, frac = Inkproof.Export.trimZeros frac ++ List.replicate k '0' ∧ (Inkproof.Export.trimZeros frac).getLast? ≠ Option.some '0'
